    <p>Vous contrôlez désormais <b>2 à 4 unités</b> selon la taille de l'arène (jusqu'à 13&times;13), débloquez l'action <b>PUSH</b> (portée 1, recharge 2 tours) pour pousser les unités adjacentes dans l'abîme, et l'anneau extérieur de l'arène se dégrade tous les 20 tours !</p>
